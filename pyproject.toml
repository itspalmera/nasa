[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flame-intelligence"
version = "0.1.0"
description = "Traceable microgravity combustion research dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pymupdf>=1.24,<2", "openai>=1.55,<3", "chromadb>=1,<2", "pydantic-settings>=2.6,<3", "tiktoken>=0.8,<1", "python-multipart>=0.0.18", "tenacity>=9,<10", "anthropic>=0.40"]
[project.optional-dependencies]
science = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
